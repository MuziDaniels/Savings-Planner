<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Savings & Finance Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --income: #10b981;
            --expense: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .summary-cards {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            padding: 2rem;
            min-width: 280px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card h3 {
            margin: 0 0 0.75rem 0;
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .card p {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .card.income p { color: var(--income); }
        .card.expenses p { color: var(--expense); }

        #planner-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1.5rem;
            animation: fadeIn 1.2s ease;
        }

        .category-section {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s;
        }

        .category-section:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .category-header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-total {
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            background: rgba(255,255,255,0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex-grow: 1;
        }

        .item {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        .item input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .item input[type="text"] {
            flex-grow: 1;
        }

        .item input[type="number"] {
            width: 120px;
            font-weight: 500;
        }

        .item input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            color: white;
            background: var(--expense);
        }

        .add-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            padding: 0.875rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-top: 1.25rem;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .add-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My Savings Planner</h1>
            <div class="summary-cards">
                <div class="card income">
                    <h3>Total Income</h3>
                    <p id="total-income">0.00</p>
                </div>
                <div class="card expenses">
                    <h3>Total Expenses</h3>
                    <p id="total-expenses">0.00</p>
                </div>
                <div class="card balance">
                    <h3>Net Savings</h3>
                    <p id="net-savings">0.00</p>
                </div>
            </div>
        </header>
        <main id="planner-container">
            <!-- Dynamically Rendered Categories -->
        </main>
    </div>

    <script>
        const defaultData = {
            income: {
                icon: "💰", title: "Income", type: "income",
                items: [{ id: 1, name: "Salary", amount: 0 }, { id: 2, name: "Side Hustle", amount: 0 }]
            },
            housing: {
                icon: "🏠", title: "Housing & Living", type: "expense",
                items: [{ id: 3, name: "Rent/Bond", amount: 0 }, { id: 4, name: "Groceries", amount: 0 }, { id: 5, name: "Utilities", amount: 0 }]
            },
            transport: {
                icon: "🚗", title: "Vehicle & Transport", type: "expense",
                items: [{ id: 6, name: "Car Payment", amount: 0 }, { id: 7, name: "Fuel", amount: 0 }, { id: 8, name: "Insurance", amount: 0 }]
            },
            future: {
                icon: "📈", title: "Future Planning", type: "expense",
                items: [{ id: 12, name: "Emergency Fund", amount: 0 }, { id: 13, name: "Investments", amount: 0 }]
            },
            loans: {
                icon: "💳", title: "Loans & Credit", type: "expense",
                items: [{ id: 9, name: "PayJust/PayFlex", amount: 0 }, { id: 10, name: "Credit Card", amount: 0 }, { id: 99, name: "Personal Loan", amount: 0 }]
            },
            bank: {
                icon: "🏦", title: "Bank Charges", type: "expense",
                items: [{ id: 11, name: "Monthly Account Fee", amount: 0 }, { id: 111, name: "Transaction Fees", amount: 0 }]
            },
            dates: {
                icon: "🥂", title: "Dates & Entertainment", type: "expense",
                items: [{ id: 14, name: "Restaurants/Takeaways", amount: 0 }, { id: 15, name: "Movies/Events", amount: 0 }]
            },
            traveling: {
                icon: "✈️", title: "Traveling", type: "expense",
                items: [{ id: 16, name: "Holiday Fund", amount: 0 }, { id: 161, name: "Flights/Accommodation", amount: 0 }]
            },
            family: {
                icon: "👨‍👩‍👧‍👦", title: "Parents & Family", type: "expense",
                items: [{ id: 17, name: "Support for Parents", amount: 0 }, { id: 171, name: "Gifts", amount: 0 }]
            },
            hobbies: {
                icon: "🎮", title: "Hobbies", type: "expense",
                items: [{ id: 18, name: "Subscriptions (Netflix/Spotify)", amount: 0 }, { id: 19, name: "Gaming/Sports Gear", amount: 0 }]
            },
            misc: {
                icon: "🛒", title: "Miscellaneous", type: "expense",
                items: [{ id: 20, name: "Clothing", amount: 0 }, { id: 21, name: "Other Unplanned", amount: 0 }]
            }
        };

        // Persistent storage
        let budgetData = JSON.parse(localStorage.getItem('savingsPlannerData')) || defaultData;
        
        // Merge missing default categories in case users load old cache
        Object.keys(defaultData).forEach(key => {
            if (!budgetData[key]) {
                budgetData[key] = defaultData[key];
            }
        });

        let nextId = Date.now(); // Ensure unique IDs

        // Formatter for Currency
        const currencyFormatter = new Intl.NumberFormat('en-ZA', { style: 'currency', currency: 'ZAR' });

        function updateTotals() {
            let totalIncome = 0;
            let totalExpenses = 0;

            Object.values(budgetData).forEach(category => {
                const catTotal = category.items.reduce((sum, item) => sum + item.amount, 0);
                if (category.type === 'income') {
                    totalIncome += catTotal;
                } else {
                    totalExpenses += catTotal;
                }
                
                const safeTitle = category.title.replace(/[^a-zA-Z0-9]/g, '');
                const catTotalEl = document.getElementById(`total-${safeTitle}`);
                if(catTotalEl) catTotalEl.textContent = currencyFormatter.format(catTotal);
            });

            document.getElementById('total-income').textContent = currencyFormatter.format(totalIncome);
            document.getElementById('total-expenses').textContent = currencyFormatter.format(totalExpenses);
            
            const balance = totalIncome - totalExpenses;
            const balanceEl = document.getElementById('net-savings');
            balanceEl.textContent = currencyFormatter.format(balance);
            
            if(balance >= 0) {
                balanceEl.style.color = 'var(--income)';
            } else {
                balanceEl.style.color = 'var(--expense)';
            }
            
            localStorage.setItem('savingsPlannerData', JSON.stringify(budgetData));
        }

        function renderApp() {
            const container = document.getElementById('planner-container');
            container.innerHTML = '';

            Object.keys(budgetData).forEach(key => {
                const category = budgetData[key];
                const section = document.createElement('div');
                section.className = 'category-section';
                
                const safeTitle = category.title.replace(/[^a-zA-Z0-9]/g, '');

                section.innerHTML = `
                    <div class="category-header">
                        <h2>${category.icon} ${category.title}</h2>
                        <span class="category-total" id="total-${safeTitle}">R 0.00</span>
                    </div>
                    <div class="item-list" id="list-${key}"></div>
                    <button class="add-btn" onclick="addItem('${key}')">+ Add Item</button>
                `;
                
                container.appendChild(section);
                
                const listEl = document.getElementById(`list-${key}`);
                category.items.forEach(item => {
                    listEl.appendChild(createItemEl(key, item));
                });
            });

            updateTotals();
        }

        function createItemEl(catKey, item) {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <input type="text" value="${item.name}" onchange="updateItemName('${catKey}', ${item.id}, this.value)" placeholder="Item Name">
                <input type="number" value="${item.amount || ''}" onchange="updateItemAmount('${catKey}', ${item.id}, this.value)" placeholder="0.00" min="0" step="0.01">
                <button class="delete-btn" onclick="deleteItem('${catKey}', ${item.id})" title="Remove item">×</button>
            `;
            return div;
        }

        window.updateItemName = function(catKey, id, newName) {
            const item = budgetData[catKey].items.find(i => i.id === id);
            if(item) item.name = newName;
            localStorage.setItem('savingsPlannerData', JSON.stringify(budgetData));
        };

        window.updateItemAmount = function(catKey, id, newAmount) {
            const item = budgetData[catKey].items.find(i => i.id === id);
            if(item) item.amount = parseFloat(newAmount) || 0;
            updateTotals();
        };

        window.addItem = function(catKey) {
            budgetData[catKey].items.push({ id: nextId++, name: '', amount: 0 });
            renderApp();
        };

        window.deleteItem = function(catKey, id) {
            budgetData[catKey].items = budgetData[catKey].items.filter(i => i.id !== id);
            renderApp();
        };

        // Initialize App
        renderApp();
    </script>
</body>
</html>
